spring:
  application:
    name: Order Service
  profiles:
    active:
      - ${APP_PROFILE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        "[spring.json.add.type.headers]": false
      topics:
        orderCreated: ${KAFKA_TOPIC_CREATED:order-created-event}
        orderUpdated: ${KAFKA_TOPIC_UPDATED:order-updated-event}
    consumer:
        group-id: ${KAFKA_CONSUMER_GROUP_ID:payment-group}
        auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        topics:
          paymentCreated: ${KAFKA_TOPIC_CREATED:payment-created-event}
          paymentUpdated: ${KAFKA_TOPIC_UPDATED:payment-updated-event}
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:1}

cors:
  origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

server:
  port: ${SERVER_PORT:8083}

logging:
  level:
    org.springframework.security: DEBUG